<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DragonScript Web Playground 🐉</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <script src="dragonscript_engine.js"></script>
    
    <style>
        * { box-sizing: border-box; }
        body { font-family: monospace; background-color: #121212; color: #fff; margin: 0; padding: 15px; }
        h1 { color: #ff9900; margin-top: 0; font-size: 20px; text-align: center; }
        #status { text-align: center; font-size: 13px; color: #aaa; margin-bottom: 10px; }

        .main-layout { display: flex; flex-direction: column; gap: 15px; }
        @media (min-width: 768px) {
            .main-layout { flex-direction: row; height: 85vh; }
        }

        .editor-section { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 350px; }
        .board-section { width: 100%; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        @media (min-width: 768px) {
            .board-section { width: 360px; }
        }

        /* Pestañas */
        .tabs { display: flex; gap: 5px; border-bottom: 2px solid #333; }
        .tab-btn {
            background: #222;
            color: #aaa;
            border: 1px solid #333;
            border-bottom: none;
            padding: 8px 16px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
            border-radius: 6px 6px 0 0;
            width: auto;
        }
        .tab-btn.active { background: #ff9900; color: #000; border-color: #ff9900; }

        .tab-content { display: none; flex: 1; flex-direction: column; position: relative; }
        .tab-content.active { display: flex; }

        /* Editor Solapado VS Code Style */
        /* Editor Solapado VS Code Style */
        .editor-wrapper {
            position: relative;
            flex: 1;
            min-height: 250px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 0 0 6px 6px;
            overflow: hidden;
        }

        .editor-wrapper textarea, .editor-wrapper pre {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 12px;
            margin: 0;
            border: none;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre;
            word-wrap: normal;
            overflow: auto;
            tab-size: 4;
        }

        /* Fuerza la transparencia del texto tipeado para ver solo los colores de abajo */
        .editor-wrapper textarea {
            color: transparent !important;
            -webkit-text-fill-color: transparent !important;
            background: transparent !important;
            caret-color: #ffffff !important; /* Cursor blanco visible */
            resize: none;
            outline: none;
            z-index: 2;
        }

        .editor-wrapper pre {
            z-index: 1;
            pointer-events: none;
            background: transparent;
            color: #d4d4d4;
        }

        /* Colores de sintaxis VS Code */
        .hl-comment { color: #6A9955 !important; font-style: italic; } /* Verde para comentarios # */
        .hl-keyword { color: #C586C0 !important; font-weight: bold; } /* Púrpura */
        .hl-command { color: #DCDCAA !important; font-weight: bold; } /* Amarillo funciones */
        .hl-constant { color: #4FC1FF !important; } /* Azul direcciones/esferas */
        .hl-number   { color: #B5CEA8 !important; } /* Verde claro números */
        .hl-string   { color: #CE9178 !important; } /* Naranja */

        /* Toolbar */
        .file-toolbar {
            display: flex;
            gap: 6px;
            background: #181818;
            padding: 6px;
            border: 1px solid #333;
            border-bottom: none;
        }
        .file-toolbar button, .file-toolbar label {
            background: #2a2a2a;
            color: #ccc;
            font-size: 11px;
            padding: 4px 8px;
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
        }
        .file-toolbar button:hover, .file-toolbar label:hover { background: #3a3a3a; color: #fff; }

        button.action-btn { background: #ff9900; color: #000; font-weight: bold; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; width: 100%; }
        button.action-btn:disabled { background: #444; color: #888; cursor: not-allowed; }
        
        #output { width: 100%; height: 130px; background: #000; color: #00ff00; font-size: 12px; padding: 10px; border-radius: 6px; overflow-y: auto; white-space: pre-wrap; border: 1px solid #333; }

        /* Tablero GUI */
        #grid { display: grid; gap: 2px; background: #1a1b26; padding: 6px; border-radius: 6px; width: 100%; max-width: 360px; aspect-ratio: 1; border: 1px solid #333; }
        .cell { background: #282a36; border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 2px; position: relative; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 4px; padding: 2px; overflow: hidden; }
        .cell-coord { position: absolute; top: 2px; left: 2px; font-size: 8px; color: #555; pointer-events: none; }
        .guerrero-cell { border: 2px solid #50fa7b !important; background-color: #21332a !important; }
        .guerrero-tag { position: absolute; top: 2px; right: 2px; font-size: 9px; color: #50fa7b; font-weight: bold; }
        .esfera-orb { width: 32px; height: 32px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffcc00, #ff6600); box-shadow: 0 0 6px rgba(255, 102, 0, 0.8), inset -2px -2px 4px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; color: #8b0000; font-weight: bold; font-size: 11px; border: 1px solid #ffaa00; user-select: none; }

        .controls-bar { display: flex; align-items: center; gap: 8px; width: 100%; background: #1e1e1e; padding: 8px; border-radius: 6px; border: 1px solid #333; }
        .controls-bar button { padding: 6px 10px; font-size: 12px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; width: auto; }
        .slider-container { display: flex; align-items: center; gap: 6px; flex: 1; font-size: 12px; color: #ccc; }
        .slider-container input { flex: 1; }
    </style>
</head>
<body>

    <h1>DragonScript Playground 🐉</h1>
    <div id="status">Cargando Pyodide y motor...</div>

    <div class="main-layout">
        <div class="editor-section">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('program')">📄 Programa</button>
                <button class="tab-btn" onclick="switchTab('library')">📚 Biblioteca</button>
            </div>

            <div class="file-toolbar">
                <label for="file-input">📥 Cargar Archivo (.ds)</label>
                <input type="file" id="file-input" accept=".ds,.txt" style="display:none;" onchange="cargarArchivo(event)">
                <button onclick="guardarArchivo()">Exportar (.ds) 💾</button>
            </div>

            <!-- Editor Programa -->
            <div id="tab-program" class="tab-content active">
                <div class="editor-wrapper">
                    <textarea id="tx-program" spellcheck="false" oninput="updateHighlight('program')" onscroll="syncScroll('program')"></textarea>
                    <pre><code id="hl-program"></code></pre>
                </div>
            </div>

            <!-- Editor Biblioteca -->
            <div id="tab-library" class="tab-content">
                <div class="editor-wrapper">
                    <textarea id="tx-library" spellcheck="false" oninput="updateHighlight('library')" onscroll="syncScroll('library')"></textarea>
                    <pre><code id="hl-library"></code></pre>
                </div>
            </div>

            <button id="run-btn" class="action-btn" onclick="runCode()" disabled>Cargando entorno...</button>
            <div id="output">Consola de salida...</div>
        </div>

        <div class="board-section">
            <h3 style="margin: 0; color: #ff9900;">Tablero GUI Web</h3>
            <div id="grid"></div>

            <div class="controls-bar">
                <button id="pause-btn" onclick="togglePausa()">⏸ Pausa</button>
                <button id="reset-btn" onclick="resetTablero()">🔄 Reset</button>
                <div class="slider-container">
                    <span>Velocidad:</span>
                    <input type="range" id="speed-slider" min="50" max="1000" value="300" step="50" onchange="actualizarVelocidad(this.value)">
                </div>
            </div>
        </div>
    </div>

    <script>
        let pyodide;
        let pasotableroQueue = [];
        let animandoTablero = false;
        let enPausa = false;
        let velocidadAnimacion = 300;
        let ultimoEstadoTablero = null;
        let activeTab = 'program';

        const ESTRELLAS_MAP = {
            "ESFERA_1": "1★", "ESFERA_2": "2★", "ESFERA_3": "3★",
            "ESFERA_4": "4★", "ESFERA_5": "5★", "ESFERA_6": "6★", "ESFERA_7": "7★"
        };

        // Resaltador de Sintaxis con todas las palabras reservadas de DragonScript
function highlightCode(src) {
    let escaped = src
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

    return escaped.replace(
        /(#[^\n]*)|("[^"]*")|\b(PROGRAMA|ROSHI|GOKU|KAIOSHIN|SAYAYIN|SI_HAY|SINO|MIENTRAS|RETORNAR)\b|\b(INICIAR_TABLERO|VOLAR|CARGAR|DRENAR|MOSTRAR_TABLERO)\b|\b(NORTE|SUR|ESTE|OESTE|ESFERA_1|ESFERA_2|ESFERA_3|ESFERA_4|ESFERA_5|ESFERA_6|ESFERA_7)\b|\b(\d+)\b/g,
        (match, comment, str, keyword, command, constant, number) => {
            if (comment) return `<span class="hl-comment">${comment}</span>`;     // Verde comentarios
            if (str) return `<span class="hl-string">${str}</span>`;             // Naranja strings
            if (keyword) return `<span class="hl-keyword">${keyword}</span>`;         // Púrpura (ROSHI, GOKU, KAIOSHIN, PROGRAMA, etc.)
            if (command) return `<span class="hl-command">${command}</span>`;         // Amarillo (VOLAR, CARGAR, DRENAR, etc.)
            if (constant) return `<span class="hl-constant">${constant}</span>`;     // Azul (NORTE, SUR, ESFERA_1, etc.)
            if (number) return `<span class="hl-number">${number}</span>`;         // Verde claro números
            return match;
        }
    ) + (src.endsWith('\n') ? ' ' : '');
}

        function updateHighlight(tab) {
            const tx = document.getElementById(`tx-${tab}`);
            const hl = document.getElementById(`hl-${tab}`);
            hl.innerHTML = highlightCode(tx.value);
            localStorage.setItem(`ds_${tab}`, tx.value);
        }

        function syncScroll(tab) {
            const tx = document.getElementById(`tx-${tab}`);
            const pre = document.querySelector(`#tab-${tab} pre`);
            pre.scrollTop = tx.scrollTop;
            pre.scrollLeft = tx.scrollLeft;
        }

        function initEditors() {
            const defaultProgram = localStorage.getItem("ds_program") || `INICIAR_TABLERO(4, 4)\n\n# Llamamos al procedimiento de la biblioteca\nMoverYRecoger(ESTE, ESFERA_1)\nMoverYRecoger(NORTE, ESFERA_7)\n\nMOSTRAR_TABLERO()`;
            const defaultLibrary = localStorage.getItem("ds_library") || `# Biblioteca Gobstones-style\nROSHI MoverYRecoger(direccion, esfera) {\n    VOLAR(direccion)\n    CARGAR(esfera)\n}`;

            const txProg = document.getElementById("tx-program");
            const txLib = document.getElementById("tx-library");

            txProg.value = defaultProgram;
            txLib.value = defaultLibrary;

            updateHighlight('program');
            updateHighlight('library');
        }

        function switchTab(tabName) {
            activeTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            if (tabName === 'program') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-program').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-library').classList.add('active');
            }
        }

        function cargarArchivo(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const content = evt.target.result;
                const tx = document.getElementById(`tx-${activeTab}`);
                tx.value = content;
                updateHighlight(activeTab);
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        function guardarArchivo() {
            const content = document.getElementById(`tx-${activeTab}`).value;
            const fileName = activeTab === 'program' ? 'programa.ds' : 'biblioteca.ds';
            
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = fileName;
            a.click();
        }

        window.actualizarTableroJS = function(ancho, alto, posX, posY, celdasJson) {
            ultimoEstadoTablero = { ancho, alto, posX, posY, celdasJson };
            pasotableroQueue.push(ultimoEstadoTablero);
            if (!animandoTablero) procesarColaAnimacion();
        };

        function togglePausa() {
            enPausa = !enPausa;
            document.getElementById("pause-btn").innerText = enPausa ? "▶ Reanudar" : "⏸ Pausa";
            if (!enPausa && pasotableroQueue.length > 0) procesarColaAnimacion();
        }

        function resetTablero() {
            pasotableroQueue = [];
            animandoTablero = false;
            enPausa = false;
            document.getElementById("pause-btn").innerText = "⏸ Pausa";
            if (ultimoEstadoTablero) {
                renderizarFrameTablero(ultimoEstadoTablero.ancho, ultimoEstadoTablero.alto, 0, 0, "{}");
            }
        }

        function actualizarVelocidad(val) { velocidadAnimacion = 1050 - parseInt(val); }

        function procesarColaAnimacion() {
            if (enPausa) return;
            if (pasotableroQueue.length === 0) {
                animandoTablero = false;
                return;
            }
            animandoTablero = true;
            const estado = pasotableroQueue.shift();
            renderizarFrameTablero(estado.ancho, estado.alto, estado.posX, estado.posY, estado.celdasJson);
            setTimeout(procesarColaAnimacion, velocidadAnimacion);
        }

        function renderizarFrameTablero(ancho, alto, posX, posY, celdasJson) {
            const grid = document.getElementById("grid");
            if (!grid) return;

            grid.style.gridTemplateColumns = `repeat(${ancho}, 1fr)`;
            grid.innerHTML = "";

            let celdas = {};
            try { celdas = JSON.parse(celdasJson); } catch (e) {}

            for (let r = alto - 1; r >= 0; r--) {
                for (let c = 0; c < ancho; c++) {
                    const cell = document.createElement("div");
                    cell.className = "cell";

                    const coord = document.createElement("span");
                    coord.className = "cell-coord";
                    coord.innerText = `(${c},${r})`;
                    cell.appendChild(coord);

                    if (c === posX && r === posY) {
                        cell.classList.add("guerrero-cell");
                        const tag = document.createElement("span");
                        tag.className = "guerrero-tag";
                        tag.innerText = "GUERRERO";
                        cell.appendChild(tag);
                    }

                    const key = `(${c}, ${r})`;
                    const esferasEnCelda = celdas[key] || {};

                    for (const [esfera, cantidad] of Object.entries(esferasEnCelda)) {
                        if (cantidad > 0) {
                            const orb = document.createElement("div");
                            orb.className = "esfera-orb";
                            const estrellas = ESTRELLAS_MAP[esfera] || esfera;
                            orb.innerText = cantidad > 1 ? `${cantidad}x${estrellas}` : estrellas;
                            cell.appendChild(orb);
                        }
                    }

                    grid.appendChild(cell);
                }
            }
        }

        async function init() {
            initEditors();
            const status = document.getElementById("status");
            const btn = document.getElementById("run-btn");
            const output = document.getElementById("output");

            try {
                pyodide = await loadPyodide();

                pyodide.setStdout({
                    batched: (text) => { output.innerText += text + "\n"; }
                });

                pyodide.FS.mkdir('/target');
                pyodide.FS.mkdir('/target/dragonscript');
                
                if (window.DRAGONSCRIPT_FILES) {
                    for (const [filename, content] of Object.entries(window.DRAGONSCRIPT_FILES)) {
                        pyodide.FS.writeFile(`/target/dragonscript/${filename}`, content);
                    }
                }

                await pyodide.runPythonAsync(`
import sys
sys.path.append('/target')
from dragonscript.lexer import Lexer
from dragonscript.parser import Parser
from dragonscript.interpreter import Interpreter

def execute_dragonscript(user_code, lib_code):
    full_code = lib_code + "\\n" + user_code
    tokens = Lexer(full_code).tokenize()
    ast = Parser(tokens).parse()
    Interpreter().interpret(ast)
`);

                status.innerText = "⚡ Entorno listo";
                btn.innerText = "Ejecutar Código ⚡";
                btn.disabled = false;
            } catch (err) {
                status.innerText = "Error: " + err.message;
            }
        }

        async function runCode() {
            const code = document.getElementById("tx-program").value;
            const libCode = document.getElementById("tx-library").value;
            const output = document.getElementById("output");
            const btn = document.getElementById("run-btn");
            output.innerText = "";

            pasotableroQueue = [];
            animandoTablero = false;
            enPausa = false;
            document.getElementById("pause-btn").innerText = "⏸ Pausa";

            btn.disabled = true;
            btn.innerText = "Ejecutando...";

            try {
                pyodide.globals.set("user_code", code);
                pyodide.globals.set("lib_code", libCode);
                await pyodide.runPythonAsync(`execute_dragonscript(user_code, lib_code)`);
            } catch (err) {
                output.innerText += "\nError de ejecucion: " + err.message;
            } finally {
                btn.disabled = false;
                btn.innerText = "Ejecutar Código ⚡";
            }
        }

        window.addEventListener("DOMContentLoaded", init);
    </script>
</body>
</html>
