<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DragonScript Web Playground 🐉</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <script src="dragonscript_engine.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: monospace; background-color: #121212; color: #fff; margin: 0; padding: 15px; }
        h1 { color: #ff9900; margin-top: 0; font-size: 20px; text-align: center; }
        #status { text-align: center; font-size: 13px; color: #aaa; margin-bottom: 10px; }

        .main-layout { display: flex; flex-direction: column; gap: 15px; }
        @media (min-width: 768px) {
            .main-layout { flex-direction: row; height: 85vh; }
        }

        .editor-section { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 350px; }
        .board-section { width: 100%; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        @media (min-width: 768px) {
            .board-section { width: 340px; }
        }

        textarea { width: 100%; flex: 1; min-height: 180px; background: #1e1e1e; color: #d4d4d4; font-size: 14px; padding: 10px; border: 1px solid #333; border-radius: 6px; resize: none; }
        button { background: #ff9900; color: #000; font-weight: bold; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; width: 100%; }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        #output { width: 100%; height: 140px; background: #000; color: #00ff00; font-size: 12px; padding: 10px; border-radius: 6px; overflow-y: auto; white-space: pre-wrap; border: 1px solid #333; }

        #grid { 
            display: grid; 
            gap: 4px; 
            background: #222; 
            padding: 6px; 
            border-radius: 6px; 
            width: 100%; 
            max-width: 340px; 
            aspect-ratio: 1; 
            border: 1px solid #333;
        }

        .cell { 
            background: #2d2d2d; 
            border-radius: 4px; 
            position: relative; 
            display: flex; 
            flex-wrap: wrap; 
            align-content: center; 
            justify-content: center; 
            gap: 2px; 
            padding: 2px;
            overflow: hidden;
        }

        .guerrero-cell {
            border: 2px solid #ff9900 !important;
            background-color: #3a3a2a !important;
        }

        .badge {
            font-size: 10px;
            padding: 1px 3px;
            border-radius: 3px;
            background: #333;
            color: #fff;
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }
    </style>
</head>
<body>

    <h1>DragonScript Playground 🐉</h1>
    <div id="status">Cargando Pyodide y motor...</div>

    <div class="main-layout">
        <div class="editor-section">
            <textarea id="code" placeholder="Escribí tu código DragonScript...">
INICIAR_TABLERO(4, 4)
CARGAR(ESFERA_1)
VOLAR(ESTE)
CARGAR(ESFERA_7)
VOLAR(NORTE)
MOSTRAR_TABLERO()
            </textarea>

            <button id="run-btn" onclick="runCode()" disabled>Cargando entorno...</button>
            <div id="output">Consola de salida...</div>
        </div>

        <div class="board-section">
            <h3 style="margin: 0; color: #ff9900;">Tablero GUI Web</h3>
            <div id="grid"></div>
        </div>
    </div>

    <script>
        let pyodide;
        let pasotableroQueue = [];
        let animandoTablero = false;

        const ESTRELLAS_MAP = {
            "ESFERA_1": "1⭐",
            "ESFERA_2": "2⭐",
            "ESFERA_3": "3⭐",
            "ESFERA_4": "4⭐"
        };

        window.actualizarTableroJS = function(ancho, alto, posX, posY, celdasJson) {
            pasotableroQueue.push({ ancho, alto, posX, posY, celdasJson });
            if (!animandoTablero) {
                procesarColaAnimacion();
            }
        };

        function procesarColaAnimacion() {
            if (pasotableroQueue.length === 0) {
                animandoTablero = false;
                return;
            }

            animandoTablero = true;
            const estado = pasotableroQueue.shift();
            renderizarFrameTablero(estado.ancho, estado.alto, estado.posX, estado.posY, estado.celdasJson);
            setTimeout(procesarColaAnimacion, 300);
        }

        function renderizarFrameTablero(ancho, alto, posX, posY, celdasJson) {
            const grid = document.getElementById("grid");
            if (!grid) return;

            grid.style.gridTemplateColumns = `repeat(${ancho}, 1fr)`;
            grid.innerHTML = "";

            let celdas = {};
            try { celdas = JSON.parse(celdasJson); } catch (e) {}

            for (let r = alto - 1; r >= 0; r--) {
                for (let c = 0; c < ancho; c++) {
                    const cell = document.createElement("div");
                    cell.className = "cell";

                    if (c === posX && r === posY) {
                        cell.classList.add("guerrero-cell");
                        const guerreroTag = document.createElement("span");
                        guerreroTag.style.fontSize = "14px";
                        guerreroTag.innerText = "🥋";
                        cell.appendChild(guerreroTag);
                    }

                    const key = `(${c}, ${r})`;
                    const esferasEnCelda = celdas[key] || {};

                    for (const [esfera, cantidad] of Object.entries(esferasEnCelda)) {
                        if (cantidad > 0) {
                            const badge = document.createElement("span");
                            badge.className = "badge";
                            const estrellas = ESTRELLAS_MAP[esfera] || esfera;
                            badge.innerText = `🟠${estrellas}${cantidad > 1 ? ' x' + cantidad : ''}`;
                            cell.appendChild(badge);
                        }
                    }

                    grid.appendChild(cell);
                }
            }
        }

        async function init() {
            const status = document.getElementById("status");
            const btn = document.getElementById("run-btn");
            const output = document.getElementById("output");

            try {
                pyodide = await loadPyodide();

                pyodide.setStdout({
                    batched: (text) => { output.innerText += text + "\n"; }
                });

                pyodide.FS.mkdir('/target');
                pyodide.FS.mkdir('/target/dragonscript');
                
                for (const [filename, content] of Object.entries(window.DRAGONSCRIPT_FILES)) {
                    pyodide.FS.writeFile(`/target/dragonscript/${filename}`, content);
                }

                await pyodide.runPythonAsync(`
import sys
sys.path.append('/target')
from dragonscript.lexer import Lexer
from dragonscript.parser import Parser
from dragonscript.interpreter import Interpreter

def execute_dragonscript(code):
    tokens = Lexer(code).tokenize()
    ast = Parser(tokens).parse()
    Interpreter().interpret(ast)
`);

                status.innerText = "⚡ Entorno listo";
                btn.innerText = "Ejecutar Código ⚡";
                btn.disabled = false;
            } catch (err) {
                status.innerText = "Error: " + err.message;
            }
        }

        async function runCode() {
            const code = document.getElementById("code").value;
            const output = document.getElementById("output");
            const btn = document.getElementById("run-btn");
            output.innerText = "";

            pasotableroQueue = [];
            animandoTablero = false;

            btn.disabled = true;
            btn.innerText = "Ejecutando...";

            try {
                pyodide.globals.set("user_code", code);
                await pyodide.runPythonAsync(`execute_dragonscript(user_code)`);
            } catch (err) {
                output.innerText += "\nError de ejecucion: " + err.message;
            } finally {
                btn.disabled = false;
                btn.innerText = "Ejecutar Código ⚡";
            }
        }

        init();
    </script>
</body>
</html>
