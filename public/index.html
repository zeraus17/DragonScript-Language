<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DragonScript Web Playground 🐉</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <script src="dragonscript_engine.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: monospace; background-color: #121212; color: #fff; margin: 0; padding: 15px; }
        h1 { color: #ff9900; margin-top: 0; font-size: 20px; }
        .main-layout { display: flex; gap: 15px; height: 90vh; }
        .editor-section { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .board-section { width: 320px; display: flex; flex-direction: column; gap: 10px; }
        
        textarea { width: 100%; height: 50%; background: #1e1e1e; color: #d4d4d4; font-size: 14px; padding: 10px; border: 1px solid #333; border-radius: 6px; resize: none; }
        button { background: #ff9900; color: #000; font-weight: bold; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        #output { width: 100%; height: 45%; background: #000; color: #00ff00; font-size: 13px; padding: 10px; border-radius: 6px; overflow-y: auto; white-space: pre-wrap; border: 1px solid #333; }
        
        /* Tablero Visual Grid */
        #grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: #222; padding: 5px; border-radius: 6px; aspect-ratio: 1; }
        .cell { background: #333; display: flex; align-items: center; justify-content: center; font-size: 20px; border-radius: 4px; }
        .player { background: #ff9900; }
        .dragonball { background: #e67e22; }
    </style>
</head>
<body>

    <h1>DragonScript Playground 🐉</h1>
    <div id="status">Cargando Pyodide y motor...</div>

    <div class="main-layout">
        <div class="editor-section">
            <textarea id="code" placeholder="Escribí tu código DragonScript...">
KI poder = 9000

TECNICA VerPoder(poder) {
    TRANSMITIR poder
}

SCOUTER "El poder de pelea es: " + STR(VerPoder(poder))
            </textarea>

            <button id="run-btn" onclick="runCode()" disabled>Cargando entorno...</button>
            <div id="output">Consola de salida...</div>
        </div>

        <div class="board-section">
            <h3>Tablero GUI Web</h3>
            <div id="grid"></div>
        </div>
    </div>

    <script>
        let pyodide;
        let boardState = { x: 0, y: 0, size: 5, balls: [] };

        function renderBoard() {
            const grid = document.getElementById("grid");
            grid.innerHTML = "";
            for (let r = 0; r < boardState.size; r++) {
                for (let c = 0; c < boardState.size; c++) {
                    const cell = document.createElement("div");
                    cell.className = "cell";
                    if (boardState.x === c && boardState.y === r) {
                        cell.classList.add("player");
                        cell.innerText = "🧙‍♂️";
                    } else if (boardState.balls.some(b => b.x === c && b.y === r)) {
                        cell.classList.add("dragonball");
                        cell.innerText = "🔮";
                    }
                    grid.appendChild(cell);
                }
            }
        }

        async function init() {
            const status = document.getElementById("status");
            const btn = document.getElementById("run-btn");
            const output = document.getElementById("output");

            try {
                pyodide = await loadPyodide();

                pyodide.setStdout({
                    batched: (text) => { output.innerText += text + "\n"; }
                });

                pyodide.FS.mkdir('/target');
                pyodide.FS.mkdir('/target/dragonscript');
                
                for (const [filename, content] of Object.entries(window.DRAGONSCRIPT_FILES)) {
                    pyodide.FS.writeFile(`/target/dragonscript/${filename}`, content);
                }

                await pyodide.runPythonAsync(`
import sys
sys.path.append('/target')
from dragonscript.lexer import Lexer
from dragonscript.parser import Parser
from dragonscript.interpreter import Interpreter

def execute_dragonscript(code):
    tokens = Lexer(code).tokenize()
    ast = Parser(tokens).parse()
    Interpreter().interpret(ast)
`);

                renderBoard();
                status.innerText = "⚡ Entorno listo";
                btn.innerText = "Ejecutar Código ⚡";
                btn.disabled = false;
            } catch (err) {
                status.innerText = "Error: " + err.message;
            }
        }

        async function runCode() {
            const code = document.getElementById("code").value;
            const output = document.getElementById("output");
            output.innerText = "";

            try {
                pyodide.globals.set("user_code", code);
                await pyodide.runPythonAsync(`execute_dragonscript(user_code)`);
            } catch (err) {
                output.innerText += "\nError de ejecucion: " + err.message;
            }
        }

        init();

    // Función global que Python llamará directamente a través de 'js.actualizarTableroJS'
    window.actualizarTableroJS = function(ancho, alto, posX, posY, celdasJson) {
        const grid = document.getElementById("grid");
        if (!grid) return;

        grid.style.gridTemplateColumns = `repeat(${ancho}, 1fr)`;
        grid.innerHTML = "";

        let celdas = {};
        try {
            celdas = JSON.parse(celdasJson);
        } catch (e) {}

        for (let r = 0; r < alto; r++) {
            for (let c = 0; c < ancho; c++) {
                const cell = document.createElement("div");
                cell.className = "cell";
                cell.style.position = "relative";
                cell.style.display = "flex";
                cell.style.flexWrap = "wrap";
                cell.style.alignContent = "center";
                cell.style.justifyContent = "center";
                cell.style.gap = "4px";

                // Casilla donde está volando el Guerrero
                if (c === posX && r === posY) {
                    cell.style.border = "2px solid #ff9900";
                    cell.style.backgroundColor = "#2a2a2a";
                    
                    const guerreroTag = document.createElement("span");
                    guerreroTag.style.fontSize = "14px";
                    guerreroTag.innerText = "🥋";
                    cell.appendChild(guerreroTag);
                }

                const key = `(${c}, ${r})`;
                const esferasEnCelda = celdas[key] || {};

                // Renderizamos cada Esfera del Dragón acumulada en la celda
                for (const [esfera, cantidad] of Object.entries(esferasEnCelda)) {
                    if (cantidad > 0) {
                        const badge = document.createElement("span");
                        badge.style.fontSize = "11px";
                        badge.style.padding = "2px 4px";
                        badge.style.borderRadius = "4px";
                        badge.style.background = "#ff9900";
                        badge.style.color = "#000";
                        badge.style.fontWeight = "bold";
                        
                        // Formato: 🔮E1 x3
                        const numEsfera = esfera.replace("ESFERA_", "E");
                        badge.innerText = `🔮${numEsfera} x${cantidad}`;
                        cell.appendChild(badge);
                    }
                }

                grid.appendChild(cell);
            }
        }
    };

    </script>
</body>
</html>
